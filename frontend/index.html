<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GenPredict — Will it be up or down?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header class="header" data-app-header></header>

<main class="page">
  <div class="page__head">
    <h1 class="page__title">Will it be up or down?</h1>
    <p class="page__sub">
      Back UP or DOWN on a coin's price over a fixed horizon. Winners split the whole pool.
      Prices are fetched and agreed on-chain by GenLayer validators — no oracle.
    </p>
  </div>

  <div data-claim-banner class="hidden"></div>

  <div id="fund-prompt" class="fund-prompt hidden" style="margin-bottom:18px"></div>

  <div class="search">
    <svg class="search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
    </svg>
    <input id="coin-search" type="search" autocomplete="off" spellcheck="false"
           placeholder="Search 1,000+ coins — try SOL, pepe, chainlink…"
           aria-label="Search coins"/>
    <button id="search-clear" class="search__clear hidden" aria-label="Clear search">✕</button>
  </div>
  <div id="search-results" class="hidden"></div>

  <div class="filters">
    <div class="chips" id="horizon-chips" role="tablist" aria-label="Horizon"></div>
    <div class="chips" id="asset-chips" role="tablist" aria-label="Asset"></div>
  </div>

  <div class="section-head">
    <h2 id="list-heading">Open markets</h2>
    <p id="list-note"></p>
  </div>

  <div class="grid" id="market-grid">
    <div class="skel skel-card"></div>
    <div class="skel skel-card"></div>
    <div class="skel skel-card"></div>
  </div>

  <div id="claims-section" class="hidden">
    <div class="section-head">
      <h2>Your recent results</h2>
      <p id="claims-note"></p>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Market</th><th>Round</th><th class="t-center">Your pick</th>
              <th class="t-center">Staked</th><th class="t-center">Outcome</th>
              <th class="t-right">Result</th><th class="t-right">Collect</th>
            </tr>
          </thead>
          <tbody id="claims-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script type="importmap">
{
  "imports": {
    "genlayer-js": "https://esm.sh/genlayer-js@1.1.8",
    "genlayer-js/chains": "https://esm.sh/genlayer-js@1.1.8/chains",
    "genlayer-js/types": "https://esm.sh/genlayer-js@1.1.8/types",
    "viem/accounts": "https://esm.sh/viem@2.49.3/accounts"
  }
}
</script>
<script type="module" src="home.js"></script>
</body>
</html>
