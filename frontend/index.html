<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GenPredict — Will it be up or down?</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header class="header" data-app-header></header>

<main class="page">
  <div class="page__head">
    <h1 class="page__title">Will it be up or down?</h1>
    <p class="page__sub">
      Back UP or DOWN on a coin's price over a fixed horizon. Winners split the whole pool.
      Prices are fetched and agreed on-chain by GenLayer validators — no oracle.
    </p>
  </div>

  <div class="filters">
    <div class="chips" id="horizon-chips" role="tablist" aria-label="Horizon"></div>
    <div class="chips" id="asset-chips" role="tablist" aria-label="Asset"></div>
  </div>

  <div class="section-head">
    <h2 id="list-heading">Open markets</h2>
    <p id="list-note"></p>
  </div>

  <div class="grid" id="market-grid">
    <div class="skel skel-card"></div>
    <div class="skel skel-card"></div>
    <div class="skel skel-card"></div>
  </div>

  <div id="claims-section" class="hidden">
    <div class="section-head">
      <h2>Ready to collect</h2>
      <p>Rounds you won</p>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Market</th><th>Round</th><th class="t-center">Your pick</th>
              <th class="t-center">Staked</th><th class="t-center">Result</th>
              <th class="t-right">Payout</th><th class="t-right"></th>
            </tr>
          </thead>
          <tbody id="claims-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<script type="importmap">
{
  "imports": {
    "genlayer-js": "https://esm.sh/genlayer-js@1.1.8",
    "genlayer-js/chains": "https://esm.sh/genlayer-js@1.1.8/chains",
    "genlayer-js/types": "https://esm.sh/genlayer-js@1.1.8/types"
  }
}
</script>
<script type="module" src="home.js"></script>
</body>
</html>
