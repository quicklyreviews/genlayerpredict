<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Market — GenPredict</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header class="header" data-app-header></header>

<main class="page">
  <div class="page__head">
    <a href="index.html" style="font-size:13px;color:var(--text-muted)">← All markets</a>
    <h1 class="page__title" id="mkt-title" style="margin-top:6px">Loading…</h1>
    <p class="page__sub" id="mkt-sub"></p>
  </div>

  <div data-claim-banner class="hidden"></div>

  <div class="detail">
    <!-- Left column -->
    <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
      <div class="chart-wrap">
        <div class="chart-bar">
          <span id="chart-symbol" class="mono">—</span>
          <span id="chart-price" class="mono" style="color:var(--text-dim)">—</span>
        </div>
        <iframe id="tv" src="about:blank" title="Price chart"></iframe>
      </div>

      <div class="section-head"><h2>Rounds</h2><p id="rounds-note"></p></div>
      <div class="rounds" id="rounds"></div>

      <div class="section-head"><h2>Recent results</h2></div>
      <div class="table-wrap">
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>Round</th><th class="t-center">Lock</th><th class="t-center">Close</th>
                <th class="t-center">Change</th><th class="t-center">Winner</th>
                <th class="t-right">Pool</th><th class="t-right">UP / DOWN payout</th>
                <th class="t-right">You</th>
              </tr>
            </thead>
            <tbody id="history-body">
              <tr><td colspan="8" class="empty">No completed rounds yet</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Right column -->
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="panel" id="bet-panel">
        <div class="panel__title">Place a prediction</div>
        <div id="bet-body"></div>
      </div>

      <div class="panel">
        <div class="panel__title">Your bets on this market</div>
        <div id="my-bets"><div class="empty" style="padding:20px">Connect your wallet to see your bets</div></div>
      </div>

      <div class="panel">
        <div class="panel__title">How this market resolves</div>
        <dl class="rules" id="rules"></dl>
      </div>
    </div>
  </div>
</main>

<script type="importmap">
{
  "imports": {
    "genlayer-js": "https://esm.sh/genlayer-js@1.1.8",
    "genlayer-js/chains": "https://esm.sh/genlayer-js@1.1.8/chains",
    "genlayer-js/types": "https://esm.sh/genlayer-js@1.1.8/types",
    "viem/accounts": "https://esm.sh/viem@2.49.3/accounts"
  }
}
</script>
<script type="module" src="market.js"></script>
</body>
</html>
